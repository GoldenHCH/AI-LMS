[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-course-import"
version = "0.1.0"
description = "Lossless Canvas course import and round-trip model"
requires-python = ">=3.11"
dependencies = [
  "canvasapi==3.6.0",
  "requests==2.34.2",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["canvas_import*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "live: requires explicit Canvas test-tenant credentials and course IDs",
]
# Both settings point at backend/, where the Python package and its tests live.
# testpaths was "tests", which now resolves to the root tests/ directory holding the
# Node validator tests — pytest found no test_*.py there, collected nothing, and exited
# 0, so the round-trip suite silently did not run. pythonpath puts backend/ on sys.path
# so `import canvas_import` resolves when pytest runs from the repo root.
testpaths = ["backend/tests"]
pythonpath = ["backend"]
