[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-course-import"
version = "0.1.0"
description = "Lossless Canvas course import and round-trip model"
requires-python = ">=3.11"
dependencies = [
  "canvasapi==3.6.0",
  "requests==2.34.2",
  "supabase==2.31.0",
]

[tool.setuptools.packages.find]
include = ["canvas_import*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "live: requires explicit Canvas test-tenant credentials and course IDs",
]
testpaths = ["tests"]
